<style>
/* ============================================================
   字字岛 · one visual language
   ink #2B2118 · paper #FFF8EC · 3 radii · 1 sticker shadow · 3 easings
   ============================================================ */
:root{
  --ink:#2B2118; --paper:#FFF8EC; --cream:#FFF4D6;
  --sun:#FFC93C; --coral:#FF6B5B; --sky:#4FB3FF; --grass:#5CC46E; --grape:#8E6CFF; --orange:#FF9F43; --pink:#FF7FA8; --teal:#27C3C8;
  --world:#FFC93C; --world2:#FF9F43;
  --r-lg:28px; --r-md:18px; --r-sm:12px;
  --stk: 0 0 0 4px var(--ink), 0 7px 0 4px rgba(43,33,24,.22), 0 14px 26px 4px rgba(43,33,24,.18);
  --stk-sm: 0 0 0 3px var(--ink), 0 5px 0 3px rgba(43,33,24,.22), 0 10px 18px 3px rgba(43,33,24,.16);
  --pop: cubic-bezier(.2,.9,.3,1.25);
  --glide: cubic-bezier(.45,0,.2,1);
  --drop: cubic-bezier(.5,0,.9,.4);
  --st: env(safe-area-inset-top,0px); --sr: env(safe-area-inset-right,0px);
  --sb: env(safe-area-inset-bottom,0px); --sl: env(safe-area-inset-left,0px);
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--cream);color:var(--ink);
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;
  touch-action:manipulation;overscroll-behavior:none;-webkit-text-size-adjust:100%;
  font-family:-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif}
body{position:fixed;inset:0}
img{-webkit-user-drag:none;user-select:none;pointer-events:none;display:block}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;-webkit-appearance:none;appearance:none}
::-webkit-scrollbar{display:none}
.scr{position:fixed;inset:0;display:none;overflow:hidden}
.scr.on{display:block}
.fade-in{animation:fadeIn .32s var(--glide) both}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.gone{display:none!important}

/* ---------- sticker buttons ---------- */
.btn{position:absolute;display:flex;align-items:center;justify-content:center;border-radius:50%;
  background:#fff;border:3px solid #fff;box-shadow:var(--stk);transition:transform .12s var(--pop),filter .12s;touch-action:none}
.btn.press,.tgt.press{transform:scale(.9);filter:brightness(1.06)}
.btn svg{width:62%;height:62%;overflow:visible}
.tgt{touch-action:none}
.tgt::before{content:"";position:absolute;inset:calc(-1 * var(--hy, 10px)) -10px}
.actor.tgt::before{inset:-10px calc(-1 * var(--hx, 10px))}

/* ---------- entry ---------- */
#entry{background:radial-gradient(120% 90% at 50% 18%,#FFFDF5 0%,#FFF4D6 55%,#FFE7B5 100%)}
#entry .sea{position:absolute;left:-5%;right:-5%;bottom:-2%;height:26%;background:#4EC6F0;border-radius:50% 50% 0 0/28% 28% 0 0;
  box-shadow:inset 0 10px 0 rgba(255,255,255,.45)}
#entry .sea::after{content:"";position:absolute;left:0;right:0;top:18%;height:10px;background:repeating-radial-gradient(circle at 20px 0,rgba(255,255,255,.7) 0 6px,transparent 7px 40px);opacity:.6;animation:drift 6s linear infinite}
@keyframes drift{from{background-position:0 0}to{background-position:80px 0}}
#entry .logo{position:absolute;left:50%;top:7%;width:min(34vmin,290px);transform:translateX(-50%)}
#entry .logo img{width:100%;border-radius:23%;box-shadow:0 0 0 5px var(--ink),0 10px 0 5px rgba(43,33,24,.2),0 26px 40px rgba(43,33,24,.22);animation:bob 3.2s ease-in-out infinite}
#entry .word{position:absolute;left:50%;top:calc(7% + min(34vmin,290px) + 18px);transform:translateX(-50%)}
#entry .word svg{height:min(11vmin,84px);width:auto;overflow:visible;display:block}
#play{left:50%;bottom:calc(9% + var(--sb));width:min(20vmin,150px);height:min(20vmin,150px);transform:translateX(-50%);background:var(--grass);animation:breatheBtn 1.6s ease-in-out infinite}
#play.press{transform:translateX(-50%) scale(.9)}
#play svg{width:46%;height:46%;margin-left:8%}
@keyframes breatheBtn{0%,100%{box-shadow:var(--stk)}50%{box-shadow:0 0 0 4px var(--ink),0 7px 0 4px rgba(43,33,24,.22),0 0 0 22px rgba(92,196,110,.22)}}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-1.5deg)}50%{transform:translateY(-10px) rotate(1.5deg)}}
#entry .chars{position:absolute;left:0;right:0;bottom:calc(17% + var(--sb));height:0}
#entry .chars img{position:absolute;bottom:0;height:min(17vmin,150px);filter:drop-shadow(0 6px 0 rgba(43,33,24,.12))}

/* ---------- map ---------- */
#map{background:#34C0EE}
#mapbg{position:absolute;inset:0;background-size:cover;background-position:center}
#mapsvg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.isl{position:absolute;width:0;height:0}
.isl .hit{position:absolute;border-radius:50%;touch-action:none}
.isl .land{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);transition:filter .6s}
.isl.locked .land{filter:saturate(.35) brightness(.96)}
.isl.gate.locked .land{opacity:0}
.isl.gate.sky .land{filter:hue-rotate(-75deg) saturate(1.5) brightness(1.08) drop-shadow(0 0 18px rgba(255,214,90,.95))}
.isl .hero{position:absolute;transform-origin:50% 100%}
.isl .cloudcover{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);pointer-events:none;transition:opacity .8s,transform .8s}
.isl:not(.locked) .cloudcover{opacity:0;transform:translate(-50%,-70%) scale(1.3)}
.lantern{position:absolute;display:grid;grid-template-columns:repeat(5,1fr);gap:4px;padding:7px 9px;border-radius:16px;background:rgba(255,248,236,.94);
  box-shadow:var(--stk-sm);transform:translateX(-50%)}
.lantern i{display:block;width:20px;height:20px;border-radius:50%;background:rgba(43,33,24,.1);box-shadow:inset 0 2px 0 rgba(43,33,24,.08)}
.lantern i.on{background:none;box-shadow:none}
.lantern i.on::after{content:"";display:block;width:100%;height:100%;background:url(assets/props/ui_star.png) center/contain no-repeat}
.bigstars{position:absolute;display:flex;gap:2px;transform:translateX(-50%)}
.isl .deco{position:absolute;display:flex;align-items:flex-end;gap:2px;pointer-events:none}
.isl .deco > div{height:100%;aspect-ratio:1/1;filter:drop-shadow(0 3px 0 rgba(43,33,24,.25))}
.isl .deco .pen{aspect-ratio:2/3}
.bigstars img{width:34px;height:34px;filter:drop-shadow(0 3px 0 rgba(43,33,24,.25))}
.flagpole{position:absolute;width:6px;height:70px;background:var(--ink);border-radius:3px;transform-origin:50% 100%}
.flagpole .cloth{position:absolute;left:4px;top:0;width:60px;height:42px;animation:flag 1.8s ease-in-out infinite;transform-origin:0 50%}
.flagpole .cloth svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.flagpole .cloth img{position:absolute;left:15px;top:7px;width:28px;height:28px;border-radius:50%;background:#fff;box-shadow:0 0 0 2.5px var(--ink)}
.flagpole .finial{position:absolute;left:50%;top:-17px;width:24px;height:24px;transform:translateX(-50%)}
@keyframes flag{0%,100%{transform:skewY(0)}50%{transform:skewY(-8deg) scaleX(.94)}}
#gear{right:calc(10px + var(--sr));bottom:calc(10px + var(--sb));width:88px;height:88px;background:transparent;border:0;box-shadow:none;border-radius:50%}
#gear .g{position:absolute;inset:26px;border-radius:50%;background:rgba(255,255,255,.55);box-shadow:0 0 0 2px rgba(43,33,24,.35)}
#gear svg{position:absolute;inset:30px;width:28px;height:28px;opacity:.6}
#gear .ring{position:absolute;inset:18px;width:52px;height:52px;transform:rotate(-90deg)}
#nosound{position:fixed;left:50%;top:calc(14px + var(--st));width:104px;height:104px;margin-left:-52px;background:#FFE08A;z-index:45;display:none;animation:breatheBtn 1.6s ease-in-out 4}
#nosound svg{width:66%;height:66%}
html.nosound body[data-scr="map"] #nosound{display:flex}
/* no sound: only the big speaker calls (four pulses); the avatar stays still - one thing at a time */
html.nosound #avatar .ear{background:#FFE08A;width:46px;height:46px;right:-18px;bottom:-15px}
#toast{position:absolute;right:calc(20px + var(--sr));bottom:calc(110px + var(--sb));padding:12px 18px;border-radius:var(--r-md);background:#fff;box-shadow:var(--stk-sm);font-size:16px;font-weight:700;display:none}
#toast.on{display:block;animation:fadeIn .2s both}

/* ---------- loading ---------- */
#load{background:var(--world)}
#load::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% 120%,rgba(255,255,255,.5),transparent 60%)}
#load .track{position:absolute;left:0;right:0;top:58%;height:14px;background:rgba(43,33,24,.12);border-radius:7px}
#load .runner{position:absolute;top:58%;height:min(30vmin,240px);transform:translate(-50%,-100%)}
#load .runner img{height:100%;animation:runHop .36s ease-in-out infinite alternate}
@keyframes runHop{from{transform:translateY(0) rotate(-4deg)}to{transform:translateY(-16px) rotate(4deg)}}
#load .dust{position:absolute;width:26px;height:26px;border-radius:50%;background:rgba(255,255,255,.8)}

/* ---------- game ---------- */
#game{background:#222}
#gbg{position:absolute;inset:0;background-size:cover;background-position:center;transition:opacity .4s;filter:saturate(.84) contrast(.94) brightness(1.03)}
#gbg::after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 50% 58%,rgba(255,255,255,0) 52%,rgba(40,26,12,.18) 100%);pointer-events:none}
/* one material per world: the task card and the answer cards wear the world's colours (the math stays the brightest thing) */
#game.w-peppa{--mat1:#FFF6F9;--mat2:#FFE2ED;--rim:#FF8DB3;--card:#FFFCFD;--cardrim:#FFD0E1}
#game.w-bluey{--mat1:#F0F9FF;--mat2:#D6ECFF;--rim:#6BB9F2;--card:#FBFDFF;--cardrim:#CBE6FB}
#game.w-huluwa{--mat1:#FCF6E2;--mat2:#EFDFAE;--rim:#6FA548;--card:#FFFDF6;--cardrim:#DCEBC8}
#game.w-paw{--mat1:#EEF4FF;--mat2:#D3E1FF;--rim:#E8554A;--card:#FBFCFF;--cardrim:#CFDDFA}
#game.w-xiyou{--mat1:#FFF8E6;--mat2:#FBE5B4;--rim:#D63B2F;--card:#FFFDF6;--cardrim:#F6DDA2}
#game.w-avengers{--mat1:#EEF7FF;--mat2:#CFE5FF;--rim:#3A5CC0;--card:#FAFCFF;--cardrim:#BFE8FF}
#gbg.blur{filter:blur(14px)}
#stage{position:absolute;left:0;top:0;transform-origin:0 0}
#stage > *{position:absolute}
/* one depth order on the stage: the scene <= 30 (ground furniture low; characters and things - the nearer in front) <
   cards, task card, done button 40 < a thing under the finger 45 < notes - numbers, rings, flags, badges, pairing
   lines, marks 50 (never covered) < the ghost hand 60 */
#stage > .card, #stage > .task, #stage > .done{z-index:40}
#stage > .badge, #stage > .ringo, #stage > .flagb, #stage > .note, #stage > svg.lines:not(.scene){z-index:50 !important}
.hud{position:absolute;z-index:40}
#home{left:calc(14px + var(--sl));top:calc(14px + var(--st));width:96px;height:96px;background:#FFE08A}
#home img{width:74%;height:74%;object-fit:contain}
#avatar{left:calc(134px + var(--sl));top:calc(14px + var(--st));width:96px;height:96px;background:var(--world)}
/* the face fills the round picture (tools/make_thumbs.py puts it up-left of the middle); the speaker badge sits
   OUTSIDE at the lower right, so it never covers the face and is never cut by the circle */
#avatar img{width:100%;height:100%;object-fit:cover;border-radius:50%}
#avatar .ear{position:absolute;right:-13px;bottom:-11px;width:36px;height:36px;border-radius:50%;background:#fff;box-shadow:var(--stk-sm);display:flex;align-items:center;justify-content:center}
#avatar .ear svg{width:23px;height:23px}
#tray{right:calc(14px + var(--sr));top:calc(18px + var(--st));display:flex;gap:6px;padding:10px 12px;border-radius:24px;background:rgba(255,248,236,.95);box-shadow:var(--stk-sm)}
#tray i{width:40px;height:40px;border-radius:50%;background:rgba(43,33,24,.1);box-shadow:inset 0 3px 0 rgba(43,33,24,.08);position:relative}
#tray i.on{background:none;box-shadow:none}
#tray i.on::after{content:"";position:absolute;inset:-3px;background:url(assets/props/ui_star.png) center/contain no-repeat}
#ff{position:absolute;inset:0;z-index:35;display:none}
#ff.on{display:block}
#fx{position:absolute;inset:0;pointer-events:none;z-index:50;overflow:hidden}
#fx > *{position:absolute}

/* banner */
.banner{left:50%;top:50%;transform:translate(-50%,-50%);font-weight:900;font-size:min(26vmin,220px);line-height:1;color:#fff;letter-spacing:.02em;
  -webkit-text-stroke:14px var(--ink);paint-order:stroke fill;text-shadow:0 12px 0 rgba(43,33,24,.25);white-space:nowrap}
.banner span{display:inline-block}

/* actors */
.actor{transform-origin:50% 100%;will-change:transform}
.actor > .body{position:absolute;inset:0;transform-origin:50% 100%;animation:breathe 3.4s ease-in-out infinite}
.actor img.spr{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 8px 0 rgba(43,33,24,.13))}
.actor .lid{position:absolute;border-radius:50%;transform:scaleY(0);transform-origin:50% 0;opacity:0}
.actor .lid::after{content:"";position:absolute;left:8%;right:8%;top:38%;height:30%;border-bottom:3px solid var(--ink);border-radius:0 0 50% 50%}
.actor.blink .lid{animation:blink .16s ease-in-out}
@keyframes blink{0%{transform:scaleY(0);opacity:1}45%,60%{transform:scaleY(1);opacity:1}100%{transform:scaleY(0);opacity:1}}
@keyframes breathe{0%,100%{transform:scale(1,1)}50%{transform:scale(1.012,1.028)}}
.actor .hat{position:absolute;pointer-events:none}
.actor .bubble{position:absolute;left:50%;top:-8%;transform:translate(-50%,-100%);width:64px;height:64px;border-radius:50%;background:#fff;box-shadow:var(--stk-sm);display:flex;align-items:center;justify-content:center}
.actor .shadow{position:absolute;left:18%;right:18%;bottom:-2%;height:7%;border-radius:50%;background:rgba(43,33,24,.14);z-index:-1}

/* math representations */
.card{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;background:var(--card,#fff);border-radius:var(--r-lg);border:4px solid var(--cardrim,#fff);box-shadow:var(--stk);touch-action:none;transition:transform .14s var(--pop),filter .14s}
.card.press{transform:scale(.92)}
.card .d{display:block;flex-shrink:0}
.card.hi{filter:drop-shadow(0 0 18px rgba(255,201,60,.95))}
.card.dim{opacity:.35}
.badge{width:48px;height:48px;border-radius:50%;background:var(--sun);box-shadow:var(--stk-sm);display:flex;align-items:center;justify-content:center;pointer-events:none}
.badge svg{overflow:visible}
.flagb{pointer-events:none}
.task{left:50%;display:flex;align-items:center;gap:10px;padding:8px 16px;border-radius:var(--r-lg);background:linear-gradient(var(--mat1,#FFF8EC),var(--mat2,#FFF1D6));box-shadow:0 0 0 3px var(--ink),0 0 0 7px var(--rim,#FFC93C),0 7px 0 7px rgba(43,33,24,.18);transform:translateX(-50%);pointer-events:none}
.task .it{display:flex;align-items:center;justify-content:center;gap:4px}
.task img{height:54px;width:auto}
.task .arw{width:34px;height:34px}
.task .goal .tap{animation:goalTap 1.2s ease-in-out 3;transform-box:fill-box;transform-origin:50% 0}
@keyframes goalTap{0%,55%,100%{transform:translateY(0) scale(1)}70%{transform:translateY(-6px) scale(1)}85%{transform:translateY(2px) scale(.9)}}
.task .qboth{display:flex;align-items:center;gap:6px}
.task .linkpic{display:flex;gap:6px}
.task .linkpic .lk{display:flex;flex-direction:column;align-items:center}
.task .linkpic img{height:30px;width:auto}
.task .qdots{position:relative;display:flex;align-items:center;justify-content:center;min-width:46px;min-height:46px;perspective:200px}
.task .qflap{position:absolute;inset:-3px;display:flex;align-items:center;justify-content:center;background:#FFE08A;border-radius:12px;box-shadow:0 0 0 3px var(--ink);transform-origin:50% 0}
.task .qflap svg{width:38px;height:38px}
.done{border-radius:50%;background:var(--grass);border:3px solid #fff;box-shadow:var(--stk);display:flex;align-items:center;justify-content:center;touch-action:none;transition:transform .12s var(--pop)}
.done.press{transform:scale(.9)}
.done svg{width:58%;height:58%;overflow:visible}
.done .ring{position:absolute;inset:-12px;width:calc(100% + 24px);height:calc(100% + 24px);transform:rotate(-90deg);pointer-events:none}
.done.ready{animation:readyPulse 1.2s ease-in-out 2.4s 2}   /* "done?" only after a pause, twice (single focus) */
@keyframes readyPulse{0%,100%{box-shadow:var(--stk)}50%{box-shadow:0 0 0 4px var(--ink),0 7px 0 4px rgba(43,33,24,.22),0 0 0 18px rgba(255,255,255,.55)}}
.glow{filter:drop-shadow(0 0 14px rgba(255,236,140,1)) drop-shadow(0 0 4px rgba(255,255,255,1))}
.yellowflash{animation:yflash .5s ease-in-out 3}
@keyframes yflash{0%,100%{filter:none}50%{filter:drop-shadow(0 0 16px #FFD93C) brightness(1.15)}}
.wiggle{animation:wig .42s ease-in-out}
@keyframes wig{0%,100%{transform:rotate(0)}20%{transform:rotate(-9deg)}40%{transform:rotate(8deg)}60%{transform:rotate(-6deg)}80%{transform:rotate(4deg)}}
.item{touch-action:none;transform-origin:50% 60%}
.item:not(.tgt){pointer-events:none}   /* a picture that is not a target never swallows a tap meant for what lies under it */
.item img{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 5px 0 rgba(43,33,24,.14))}
.hand{width:96px;height:96px;z-index:60;pointer-events:none;transform-origin:30% 10%}
.spark{width:14px;height:14px;border-radius:50%}
svg.lines{left:0;top:0;overflow:visible;pointer-events:none}
.ringo{border:5px dashed var(--ink);border-radius:999px;pointer-events:none}

/* ---------- parent ---------- */
#parent{background:rgba(43,33,24,.55);z-index:100}
#parent .sheet{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(92vw,760px);max-height:92vh;overflow:auto;background:var(--paper);border-radius:var(--r-lg);box-shadow:var(--stk);padding:22px 26px;font-size:16px;line-height:1.5}
#parent h2{margin:0 0 10px;font-size:22px}
#parent h3{margin:18px 0 8px;font-size:17px}
#parent table{border-collapse:collapse;width:100%;font-size:14px}
#parent td,#parent th{border-bottom:1px solid rgba(43,33,24,.12);padding:6px 4px;text-align:left}
#parent .pbtn{display:inline-flex;align-items:center;justify-content:center;min-width:88px;min-height:52px;padding:0 16px;margin:4px 6px 4px 0;border-radius:14px;background:#fff;box-shadow:var(--stk-sm);font-weight:700}
#parent .pbtn.warn{background:#FFE1DC}

/* ================================================================ STAGE

   background: square image, cover-scaled to the viewport; bgPoint() maps image anchors -> stage coords

    this.el = $('#stage'); this.bg = $('#gbg');

    window.addEventListener('resize', re);
    window.addEventListener('orientationchange', re);
  },
  fit(first) {

    this.s = Math.min(vw / this.W, vh / this.H);

/* bags: balanced sequences that defeat fixed-position / fixed-rank / fixed-meaning strategies */
function bagPick(G, name, items) {

}
/* three numeric options for answer cards; rank of the correct value balanced by the size bag */
/* The RANK of the correct value among the three (smallest / middle / largest) is dealt from a bag, restricted to the
   ranks this value allows inside [lo, hi]; a rank that does not fit stays in the bag for a later question. So "always
   the smallest / middle / largest card" is right about one time in three over any stretch - also at the range ends. */

  const ok = { min: n + 2 <= hi, mid: n - 1 >= lo && n + 1 <= hi, max: n - 2 >= lo };
  if (G.wantRank) {

    let r = G.wantRank;

    const set = r === 'min' ? [n, n + 1, n + 2] : r === 'mid' ? [n - 1, n, n + 1] : [n - 2, n - 1, n];
    return placeOptions(G, set, n);
  }
  const b = G.bags.rank || (G.bags.rank = []);
  if (!b.length) b.push(...G.rng.shuffle(['min', 'mid', 'max']));
  let i = b.findIndex(r => ok[r]), r;
  if (i >= 0) { r = b[i]; b.splice(i, 1); }
  else {
    const fresh = G.rng.shuffle(['min', 'mid', 'max']), j = fresh.findIndex(x => ok[x]);
    r = j >= 0 ? fresh.splice(j, 1)[0] : 'mid';
    b.push(...fresh);
  }
  const set = r === 'min' ? [n, n + 1, n + 2] : r === 'mid' ? [n - 1, n, n + 1] : [n - 2, n - 1, n];
  return placeOptions(G, set, n);

/* ================================================================ 字字岛 · the games
   Every island: 1 认字 (find the character: a different play on every island), 2 写字 (田字格), 3 写字母 (四线三格),
   4 挑战 (a reasoning test, different on every island). Stars as in 点点岛: only the child's own first try. */
const LOOK = { 一: '二三', 二: '一三', 三: '二一', 八: '人', 十: '七', 七: '十', 白: '日目', 来: '米', 妈: '姐', 姐: '妈', 吃: '喝', 喝: '吃', 红: '绿', 绿: '红', 日: '目田月口白', 目: '日田', 田: '日目口', 口: '日田', 人: '大从', 大: '人', 木: '禾米本', 禾: '木米', 米: '木禾', 牛: '手', 手: '牛', 马: '鸟', 鸟: '马', 上: '下', 下: '上', 月: '日明', 本: '木', 林: '木休', 从: '人', 休: '林', 明: '日月', 风: '电', 电: '田日', 包: '勺', 勺: '包', 兔: '龙', 杯: '林', 床: '林', 叶: '口', 果: '田', 车: '牛', 门: '口', 衣: '农', 巾: '中', 光: '火', 火: '光' };
const LOOKEN = { E: 'F', F: 'E', M: 'NW', N: 'M', O: 'QC', Q: 'O', P: 'RB', R: 'P', B: 'PD', U: 'V', V: 'U', b: 'd', d: 'b', p: 'q', q: 'p', m: 'n', n: 'm', i: 'j', j: 'i', u: 'n', w: 'v', C: 'G', G: 'C', I: 'L', L: 'I' };
const PICK = (G, name, items) => bagPick(G, name, items);
/* a bag over a list that may change between picks: what is in the bag but not in the list waits; nothing left refills it */
function bagFrom(G, name, items) {
  const b = G.bags[name] || (G.bags[name] = []);
  let i = b.findIndex(k => items.includes(k));
  if (i < 0) { b.length = 0; b.push(...G.rng.shuffle(items)); i = 0; }
  return b.splice(i, 1)[0];
}
/* the island's characters still to pass come first (V2R1-02) - but one of them at most twice in a session and never twice
   in a row; the other rounds take the island's other characters (W3R1-02: a session is never one character five times) */
function needPick(G, pool, bag) {
  const asked = G.asked || [], last = asked[asked.length - 1], times = k => asked.filter(x => x === k).length;
  const need = (G.needPass || []).filter(k => pool.includes(k) && k !== last && times(k) < 2);
  if (need.length) { const m = Math.min(...need.map(times)); return bagFrom(G, 'need', need.filter(k => times(k) === m)); }
  const done2 = k => (G.needPass || []).includes(k) && times(k) >= 2, rest = pool.filter(k => k !== last && !done2(k)), rest2 = pool.filter(k => k !== last);
  return bagFrom(G, bag || 'ans', rest.length ? rest : rest2.length ? rest2 : pool);
}
/* characters read but not written: the plan writes none over 8 strokes in the first two worlds (A.4) - 是 has 9 */
const NOWRITE = ['是'].concat(NOWRITE3.split(''));      /* world 3 writes 2 characters an island; the others are read (A.4) */
/* characters that hold another one inside (明 holds 月): never a look-alike option for it */
const HOLDS = { 月: '明', 日: '明喝', 木: '林休本果杯床', 人: '从休', 口: '叶吃喝哥', 火: '灯', 田: '果', 目: '看', 马: '妈' };
/* the characters / letters the child can be asked about here (this island + the islands before it, for review) */
function poolOf(G, kind, review) {
  const isl = G.W, mine = kind === 'zh' ? isl.chars.map(c => c.c) : isl.letters.map(l => l.l);
  if (!review) return mine;
  const before = ALL_ISL().slice(0, ALL_ISL().indexOf(G.world)).map(id => ISL[id]);
  const old = before.flatMap(w => kind === 'zh' ? w.chars.map(c => c.c) : w.letters.map(l => l.l)).filter(k => kind === 'zh' || /[a-z]/.test(k) === /[a-z]/.test(mine[0]));
  return mine.concat(old);
}
/* answer + options: the answer from a bag (every one of the island's items once before any comes again), the others
   look-alikes first (level >= 3), then the island's own, then review; the answer's place from a position bag */
function optsFor(G, kind, level, n, answer) {
  const own = poolOf(G, kind, false), rev = poolOf(G, kind, true).filter(k => !own.includes(k));
  const known = poolOf(G, kind, true), holds = HOLDS[answer] || '';
  const look = ((kind === 'zh' ? LOOK : LOOKEN)[answer] || '').split('').filter(k => ITEM[k] && known.includes(k) && !holds.includes(k));      /* R2-04 */
  const cand = [];
  if (level >= 3) look.forEach(k => cand.push(k));
  /* level 4: an old character among them (DESIGN §3) - also on islands with enough characters of their own (W3R1-01) */
  if (level >= 4) { const old = rev.filter(k => !holds.includes(k) && k !== answer); if (old.length) cand.push(G.rng.pick(old)); }
  G.rng.shuffle(own).forEach(k => cand.push(k));
  if (level >= 4 || cand.length < n + 1) G.rng.shuffle(rev).forEach(k => cand.push(k));
  const others = cand.filter((k, i) => k !== answer && cand.indexOf(k) === i).slice(0, n - 1);
  const pos = PICK(G, 'pos' + n, Array.from({ length: n }, (_, i) => i));
  const out = G.rng.shuffle(others); out.splice(Math.min(pos, out.length), 0, answer);
  return out;
}
const isEn = k => /^[A-Za-z]$/.test(k);
const sayItem = (k, opt) => { const it = ITEM[k]; Voice.say(it.line, Object.assign({ tag: 'summary' }, opt || {})); if (it.en && Store.s.settings.en) Voice.say(it.en, { tag: 'summary' }); };

  async feedback(st, ans) {

const FindBase = {
  kind0: 'find', verb: '找！',
  gen(G, o) {
    const lv = o.level, n = lv <= 2 ? 3 : lv <= 4 ? 4 : 5;
    const lang = this.lang || 'zh', pool = poolOf(G, lang, false), answer = needPick(G, pool);      /* still to pass first, at most twice (W3R1-02) */
    const opts = optsFor(G, lang, lv, Math.min(n, this.maxN || 9), answer), lk = (lang === 'zh' ? LOOK : LOOKEN)[answer] || '';
    /* what the level is made of: the picture on the card (L1), look-alikes (L3), old characters (L4), five (L5) */
    return { k: [answer, opts.join('')], answer, opts, pic: lv <= 1, look: opts.filter(k => k !== answer && lk.includes(k)).length, rev: opts.filter(k => !pool.includes(k)).length };
  },
  async present(st) {
    const q = st.q, G = st.G;
    await ZX.meet(st, q.answer);

    st.opts = q.opts.slice();
    this.targets(st);
    this.place(st);
    /* the task card: level 1 shows the thing to find; from level 2 it is heard - and its picture comes as the second
       hint (10 s stuck): the question said completely, never the answer (R1-04) */
    st.taskEl = K.task(st, [st.level <= 1 ? [OBJURL(ITEM[q.answer].obj), 'q'] : ['speaker', 'q']]);
    K.say(st, (isEn(q.answer) ? '找到' : '哪个是') + q.answer + (isEn(q.answer) ? '！' : '？'));

  },

  },
};

/* row / grid places for n targets inside a rect */
function spots(n, r, cols) {
  cols = cols || n;
  const rows = Math.ceil(n / cols), out = [];
  for (let i = 0; i < n; i++) { const c = i % cols, rr = Math.floor(i / cols), inRow = Math.min(cols, n - rr * cols); out.push({ x: r.x + r.w * (c + 0.5 + (cols - inRow) / 2) / cols, y: r.y + r.h * (rr + 0.5) / rows }); }
  return out;
}

/* 奥特曼 · 哪个写对了: one is right, the others mirrored / upside down / turned round. A wrong one must LOOK different:
   every variant is compared point by point with the right one and with the others (B upside down is still B, S turned
   round is still S - such a variant is never offered); glyphs turn about their own centre (R1-01, R1-07) */
const Mirror = {
  /* which turns of a glyph clearly look wrong (and unlike each other) - checked by eye, glyph by glyph (R2-01):
     symmetric ones keep only the turn that changes them (A upside down; B, C, D, E mirrored); letters whose turned shape
     is another real letter (M W N P U and the small letters) and characters like 上 / 下 / 车 / 米 are not in the table */
  T: { A: 'flipY', B: 'flipX', C: 'flipX', D: 'flipX', E: 'flipX', F: 'flipX flipY rot', G: 'flipX flipY rot', J: 'flipX flipY rot', K: 'flipX', L: 'flipX flipY rot',
       Q: 'flipX flipY rot', R: 'flipX flipY rot', S: 'flipX', T: 'flipY', V: 'flipY', Y: 'flipY', Z: 'flipX',
       月: 'flipX flipY rot', 手: 'flipX flipY', 牛: 'flipX flipY rot', 石: 'flipX flipY rot', 马: 'flipX flipY rot', 鸟: 'flipX flipY rot', 门: 'flipX flipY rot', 灯: 'flipX flipY rot', 禾: 'flipX flipY', 火: 'flipY', 羊: 'flipY' },
  wrongs(k) { return (this.T[k] || '').split(' ').filter(Boolean); },
  pts(k) {
    if (isEn(k)) return LETTERS[k].flatMap(st => Geo.resample(st, 14));
    return Hanzi.data[k].m.flatMap(m => Geo.resample(m.map(([x, y]) => [x, 900 - y]), 14));
  },
  tf(P, t, c) { return P.map(([x, y]) => t === 'flipX' ? [2 * c[0] - x, y] : t === 'flipY' ? [x, 2 * c[1] - y] : t === 'rot' ? [2 * c[0] - x, 2 * c[1] - y] : [x, y]); },
};
const QMirror = {
  kind0: 'mirror', verb: '看！', intro: '哪个写对了？', props: [],
  /* how many wrong ones: 1 (levels 1-2: is it this one or that one), 2 (level 3), 3 (levels 4-5) */
  gen(G, o) {
    const lv = o.level, n = lv <= 2 ? 1 : lv === 3 ? 2 : 3;
    const pool = poolOf(G, 'up', true).concat(lv >= 3 ? poolOf(G, 'zh', true) : []).filter(k => Mirror.wrongs(k).length >= n);
    const glyph = PICK(G, 'g' + lv, pool.length ? pool : ['R', 'F', 'G']);
    const wr = G.rng.shuffle(Mirror.wrongs(glyph)).slice(0, n);
    const pos = PICK(G, 'pos' + (n + 1), Array.from({ length: n + 1 }, (_, i) => i)); wr.splice(pos, 0, 'ok');
    return { k: [glyph, wr.join()], answer: 'ok', glyph, opts: wr };
  },
  async present(st) {
    const q = st.q, tf = { ok: '', flipX: 'scaleX(-1)', flipY: 'scaleY(-1)', rot: 'rotate(180deg)' };
    K.cards(st, q.opts.map(t => { const g = Glyph.fit(q.glyph, 124); g.style.transform = tf[t]; return g; }), q.opts, Object.assign({ size: 170, gap: 34 }, this.cardSpot()));
    const it = ITEM[q.glyph];

    Voice.say(st.lead, { tag: 'prompt' });
    K.say(st, '哪个写对了？');
  },
  cardSpot() { return K.L() ? { cx: 560, cy: 400 } : { cx: 352, cy: 560 }; },
  place(st) { K.cardsPlace(st, Object.assign({ gap: 34 }, this.cardSpot())); },
  decor(G) { const L = K.L(), a = G.actors.ultraman; if (a) showActor(a, L ? 120 : 600, L ? 690 : 1016, L ? 280 : 200); },
  async reveal(st) { const e = st.cards[st.opts.indexOf('ok')]; K.hop(st, e, 30); Sfx.reveal(); sayItem(st.q.glyph); this.cheerAll(st); await st.scope.guard(Voice.afterSay(200)); },

  iconNode() { const d = el('div'); d.style.display = 'flex'; const a = Glyph.en('R', 44), b = Glyph.en('R', 44); b.style.transform = 'scaleX(-1)'; d.appendChild(a); d.appendChild(b); return d; },
};

['zh', 'up', 'lo'].forEach(kind => writeGame({ id: 'practice:' + kind, world: '', lang: kind === 'zh' ? 'zh' : kind, bg: '', chars: [], host: 'peppa', title: '练字', intro: '练一练！', verb: '练！',

/* ================================================================ 字字岛 v2 (docs/PLAN-v2.md, agreed by Opus 5.5, Codex GPT-6
   Astra and Fable 5.1): the map is the syllabus (fixed order, the child's own speed); every character and letter has its own
   memory (7 boxes); review is mixed into every game; the function words come from sentences; story books; a daily key that
   opens the next hero card; a parent who checks without screens. Nothing here caps the day or stops new islands. */

/* ---------------------------------------------------------------- days and memory */
const DAY = () => Math.floor((Date.now() - new Date().getTimezoneOffset() * 60000) / 86400000);
const IV = [0, 1, 3, 7, 14, 30, 60, 120];                     /* box 1..7 -> days to the next test */
const Mem = {
  get(k) { return Store.s.mem[k] || null; },
  touch(k) {
    const d = DAY(); let m = Store.s.mem[k];
    if (!m) { m = Store.s.mem[k] = { b: 0, due: 0, last: d, up: -1, seen: d, pass: [], n: 0, ok: 0 }; if (ITEM[k] && ITEM[k].kind === 'zh') Mem.today().newK++; }
    return m;
  },
  /* one answer about an item. how: 'ok' (the child's own first try, no help), 'help' (right after the 2nd hint), 'wrong'.
     Only an independent first try on a due (or overdue) day moves a box up - at most once a day; a wrong answer or one
     after the 2nd hint moves it two boxes down (never below 1) and brings it back tomorrow (A.5) */
  answer(k, how, sid) {
    if (!k || !ITEM[k]) return;
    const d = DAY(), m = this.touch(k), gap = d - m.last, wasDue = m.b > 0 && d >= m.due;
    m.n++;
    if (how === 'ok') {
      m.ok++;
      if (sid && !m.pass.includes(sid)) { m.pass.push(sid); if (m.pass.length > 4) m.pass.shift(); }
      if (m.b === 0) { m.b = 1; m.due = d + 1; m.up = d; }
      else if (wasDue && m.up !== d) { m.b = Math.min(7, m.b + 1); m.due = d + IV[m.b]; m.up = d; }
    } else if (m.b > 0) { m.b = Math.max(1, m.b - 2); m.due = d + 1; }
    /* retention evidence: the first test of a due item since it was last met (a real gap, counted once) */
    if (wasDue && gap >= 1 && m.evd !== d) { m.evd = d; const ev = Store.s.ev; ev.push([gap, how === 'ok' ? 1 : 0, d]); if (ev.length > 400) ev.splice(0, ev.length - 400); }
    m.last = d;
    Store.save();
  },
  /* the parent's check: only ever lowers (A.18) */
  parentNo(k) { const m = this.touch(k), d = DAY(); m.b = Math.max(1, Math.min(m.b || 1, 1)); m.due = d + 1; Store.save(); },
  passed(k) { const m = this.get(k); return !!m && m.pass.length >= 2; },
  state(k) {
    const m = this.get(k), d = DAY();
    if (!m) return 'none';
    if (m.b >= 1 && d - m.due > 30) return 'stale';
    if (m.b >= 4) return 'known';
    if (m.b >= 1) return 'learning';
    return 'seen';
  },
  due(kind) { const d = DAY(); return Object.keys(Store.s.mem).filter(k => { const m = Store.s.mem[k]; return m.b > 0 && m.due <= d && ITEM[k] && (!kind || kind(ITEM[k])); }).sort((a, b) => Store.s.mem[a].due - Store.s.mem[b].due); },
  overdue() { const d = DAY(); return Object.keys(Store.s.mem).filter(k => { const m = Store.s.mem[k]; return m.b > 0 && m.due < d && ITEM[k] && ITEM[k].kind === 'zh'; }).length; },
  today() { const d = DAY(), D = Store.s.days; if (!D[d]) { D[d] = { ms: 0, newK: 0, q: 0, keyGo: 0, keyEnd: 0, asked: 0 }; const old = Object.keys(D).map(Number).sort((a, b) => a - b); while (old.length > 60) delete D[old.shift()]; } return D[d]; },
  /* retention over a gap band: [rate, n] (A.21) */
  keep(lo, hi) { const e = Store.s.ev.filter(x => x[0] >= lo && x[0] <= hi); return [e.length ? e.filter(x => x[1]).length / e.length : 0, e.length]; },
  brake() { const [r, n] = this.keep(7, 13); return this.overdue() > 12 || this.today().newK > 8 || (n >= 20 && r < 0.8); },
};

/* ---------------------------------------------------------------- pictures: an object, or a little composed scene */
const Scene = {
  node(spec, size) {
    const d = el('div', 'scene'); Object.assign(d.style, { position: 'relative', width: size + 'px', height: size + 'px' });
    spec.forEach(([o, x, y, k, f]) => { const s = size * k, i = img(OBJURL(o), '', d); Object.assign(i.style, { position: 'absolute', width: s + 'px', height: s + 'px', left: (x * size - s / 2) + 'px', top: (y * size - s / 2) + 'px', objectFit: 'contain', pointerEvents: 'none' }); if (f) i.style.filter = f; });      /* f: a CSS filter (a red bird for a distractor) */
    return d;
  },
  /* the picture of an item: its object, or (a function word) the scene of its first sentence */
  of(k, size) { const it = ITEM[k]; if (it && it.obj) { const i = img(OBJURL(it.obj), ''); Object.assign(i.style, { width: size + 'px', height: size + 'px', objectFit: 'contain' }); return i; } const s = FW_SENTS[k]; return s ? this.node(s[0][1], size) : Glyph.any(k, size * 0.8); },
};
/* a sentence as a row of glyphs (the missing one a dashed box); every glyph a tap target when asked for */
const Sent = {
  node(text, h, blankAt, onTap) {
    const row = el('div', 'sent'); Object.assign(row.style, { display: 'flex', alignItems: 'center', gap: Math.round(h * 0.06) + 'px', background: 'rgba(255,255,255,.94)', borderRadius: '22px', padding: '10px 18px', boxShadow: '0 0 0 4px #2B2118, 0 8px 0 rgba(43,33,24,.25)' });
    Array.from(text).forEach((c, i) => {
      if (/[。！？，]/.test(c)) { const p = el('span', '', row); p.textContent = c; Object.assign(p.style, { font: '900 ' + Math.round(h * 0.7) + 'px system-ui,sans-serif', color: INK }); return; }
      const cell = el('div', '', row); Object.assign(cell.style, { position: 'relative', width: h + 'px', height: h + 'px', display: 'flex', alignItems: 'center', justifyContent: 'center' });
      if (i === blankAt) { Object.assign(cell.style, { border: '5px dashed #2B2118', borderRadius: '14px', background: '#FFF7D6' }); cell.dataset.blank = '1'; }
      else { cell.appendChild(Glyph.zh(c, h * 0.92)); if (onTap) { cell.dataset.ch = c; cell.style.cursor = 'pointer'; } }
    });
    return row;
  },
};

/* ---------------------------------------------------------------- the review question (a card question about one item):
   "老朋友来了！" - asked by this island's host on this island's background, never in an old scene (A.6) */
const ReviewQ = Object.assign({}, ZBase, {
  id: 'review', kind0: 'review', verb: '找！', chars: [], review: true,
  gen(G, o) {
    const k = o.item, kind = ITEM[k].kind, lv = clamp(o.level || 2, 1, 5), n = lv <= 2 ? 3 : 4;
    const known = ITEMS.filter(x => x.kind === kind && x.k !== k && (Mem.get(x.k) || learned(x.k))).map(x => x.k);
    const look = ((kind === 'zh' ? LOOK : LOOKEN)[k] || '').split('').filter(x => known.includes(x) && !(HOLDS[k] || '').includes(x));
    const pool = known.filter(x => !(HOLDS[k] || '').includes(x));
    const pickFrom = G.rng.shuffle(look).concat(G.rng.shuffle(pool));
    let others = pickFrom.filter((x, i) => pickFrom.indexOf(x) === i).slice(0, n - 1);
    if (others.length < n - 1) { const more = G.rng.shuffle(ITEMS.filter(x => x.kind === kind && x.k !== k && !others.includes(x.k)).map(x => x.k)); others = others.concat(more.slice(0, n - 1 - others.length)); }
    const opts = G.rng.shuffle(others); opts.splice(G.rng.int(0, opts.length), 0, k);
    return { k: ['rv', k, opts.join('')], answer: k, opts };
  },
  itemOf(st) { return st.q.answer; },
  async present(st) {
    const q = st.q, G = st.G, L = K.L();
    if (st.missQ) Voice.say('再来一个！', { tag: 'prompt' }); else if (!G.rvSaid && !G.key) { G.rvSaid = true; Voice.say('老朋友来了！', { tag: 'prompt' }); }
    K.cards(st, q.opts.map(k => Glyph.any(k, 110)), q.opts, Object.assign({ size: 160, gap: 30 }, L ? { cx: 560, cy: 470 } : { cx: 352, cy: 700 }));
    st.taskEl = K.task(st, [['speaker', 'q']]);
    if (isEn(q.answer)) { st.prompt = '找字母'; st.tail = [ITEM[q.answer].say]; Voice.say('找字母', { tag: 'prompt' }); Voice.say(ITEM[q.answer].say, { tag: 'prompt' }); }
    else K.say(st, '哪个是' + q.answer + '？');
  },
  place(st) { const L = K.L(); K.cardsPlace(st, Object.assign({ gap: 30 }, L ? { cx: 560, cy: 470 } : { cx: 352, cy: 700 })); },
  relayoutQ(st) { this.place(st); },
  async reveal(st) { const e = st.cards[st.opts.indexOf(st.q.answer)]; K.hop(st, e, 30); Sfx.reveal(); sayItem(st.q.answer); await st.scope.guard(Voice.afterSay(200)); },
  gestureHint(st) {
    if (st.picShown || !st.taskEl) return; st.picShown = true;
    /* a function word has no picture of its own (its sentence's scene is a thing - 了 = a fire - and that thing can be an option): its sentence is said (V2R2-03) */
    if (ITEM[st.q.answer] && ITEM[st.q.answer].fw && FW_SENTS[st.q.answer]) { Voice.say(FW_SENTS[st.q.answer][0][0], { tag: 'prompt' }); return; }
    const it = st.taskEl.querySelector('.it'); const p = Scene.of(st.q.answer, 54); it.replaceChild(p, it.firstChild); Sfx.sparkle();
  },
});

/* ---------------------------------------------------------------- 补句子 (the sentence islands' 认字): the host says the whole
   sentence; the card shows it with the function word missing; pick it (3 or 4 function words / look-alikes) */
const QFill = {
  kind0: 'fill', verb: '补！', intro: '把字补上！', props: [], softHint: true,
  decor(G) { if (!K.L()) { this.chars.forEach(id => hideActor(G.actors[id])); return; } ZBase.decor.call(this, G); },
  gen(G, o) {
    const lv = o.level, pool = poolOf(G, 'zh', false), answer = needPick(G, pool);      /* still to pass first, at most twice (W3R1-02) */
    const kn = knownZh(G), more = (FW_SENTS3[answer] || []).filter(x => Array.from(x[0]).every(c => /[。！？，]/.test(c) || c === answer || kn.includes(c)));      /* phase 2: once its other characters are known */
    const s = !Store.s.met[answer] ? FW_SENTS[answer][0] : G.rng.pick(FW_SENTS[answer].concat(more)), n = lv <= 2 ? 3 : 4;
    const fws = ITEMS.filter(x => x.fw && x.k !== answer && (x.isl === G.world || Store.s.mem[x.k] || ISL[x.isl].i < G.W.i && ISL[x.isl].w === G.W.w)).map(x => x.k);
    const others = G.rng.shuffle(fws.filter(k => !s[0].includes(k))).slice(0, n - 1);
    const opts = G.rng.shuffle(others); opts.splice(G.rng.int(0, opts.length), 0, answer);
    return { k: [answer, s[0], opts.join('')], answer, text: s[0], scene: s[1], blank: s[0].indexOf(answer), opts };
  },
  itemOf(st) { return st.q.answer; },
  async present(st) {
    const q = st.q, L = K.L();
    const met = await ZX.meetFw(st, q.answer);
    if (!Session.alive(st)) return;
    const pic = st.pic = ZX.thing(st, 300, 300, 6, 'objpop'); Object.assign(pic.style, { background: '#fff', borderRadius: '26px', boxShadow: '0 0 0 4px #2B2118, 0 8px 0 rgba(43,33,24,.25)' }); pic.appendChild(Scene.node(q.scene, 300));
    const row = st.row = ZX.thing(st, 10, 10, 7, ''); row.style.width = row.style.height = 'auto'; row.appendChild(Sent.node(q.text, L ? 92 : 84, q.blank));
    K.cards(st, q.opts.map(k => Glyph.zh(k, 104)), q.opts, Object.assign({ size: 150, gap: 30 }, this.cardSpot()));
    this.place(st);
    K.pop(st, pic); K.pop(st, row, 120);
    st.prompt = q.text; if (!met) Voice.say(q.text, { tag: 'prompt' });
  },
  cardSpot() { return K.L() ? { cx: 600, cy: 590 } : { cx: 352, cy: 900 }; },
  place(st) {
    const L = K.L();
    if (st.pic) place(st.pic, L ? 250 : 202, L ? 40 : 150, 300, 300);
    if (st.row) { const r = st.row.firstChild.getBoundingClientRect(), s = Stage.scale || 1, w = r.width / s; place(st.row, Math.round((L ? 600 : 352) - w / 2), L ? 360 : 500); st.row.style.width = 'auto'; st.row.style.height = 'auto'; }
    K.cardsPlace(st, Object.assign({ gap: 30 }, this.cardSpot()));
  },
  async reveal(st) {
    const e = st.cards[st.opts.indexOf(st.q.answer)]; K.hop(st, e, 30); Sfx.reveal();
    const b = st.row && st.row.querySelector('[data-blank]'); if (b) { b.style.border = '0'; b.style.background = '#FFF3C4'; b.appendChild(Glyph.zh(st.q.answer, b.offsetWidth * 0.92 || 80)); }
    Voice.say(st.q.text, { tag: 'summary' }); this.cheerAll(st); await st.scope.guard(Voice.afterSay(200));
  },
  gestureHint(st) { if (st.hintDone) return; st.hintDone = true; Voice.say(st.q.text, { tag: 'prompt' }); if (st.row) K.hop(st, st.row, 16); },
};

/* ---------------------------------------------------------------- 读一读: read silently, tap the picture it says. The sentence is
   never read first (that would be listening); a tap on a character says it, but that question then gives no star (A.3) */
const QReadS = {
  kind0: 'reads', verb: '读！', intro: '读一读！', props: [], softHint: true,
  gen(G, o) {
    const known = G.knownZh || knownZh(G), ok = READ.filter(r => Array.from(r[0]).every(c => /[。！？，]/.test(c) || known.includes(c)));
    const r = PICK(G, 'read', ok.length ? ok : READ.slice(0, 3));
    const opts = [0, 1, 2], order = G.rng.shuffle(opts.slice());
    return { k: ['rd', r[0], order.join('')], answer: order.indexOf(0), text: r[0], scenes: order.map(i => i === 0 ? r[1] : r[2][i - 1]), opts: [0, 1, 2] };
  },
  itemOf() { return null; },
  itemsOf(st) { const own = st.G.W ? st.G.W.chars.map(c => c.c) : []; return Array.from(st.q.text).filter((c, i, a) => own.includes(c) && a.indexOf(c) === i); },
  async present(st) {
    const q = st.q, L = K.L(), size = L ? 230 : 200;
    st.peeked = false;
    const row = st.row = ZX.thing(st, 10, 10, 7, ''); row.style.width = row.style.height = 'auto';
    row.appendChild(Sent.node(q.text, L ? 96 : 88, -1, true));
    $$('[data-ch]', row).forEach((cell, i) => { K.reg(st, 'ch' + i, cell, {}); cell.dataset.gid = 'ch' + i; cell.style.pointerEvents = 'auto'; });     /* the row is a picture (no taps), its characters are targets */
    st.cards = q.scenes.map((sc, i) => { const d = ZX.thing(st, size, size, 6, 'card'); d.appendChild(Scene.node(sc, size)); K.reg(st, 'card' + i, d, {}); K.pop(st, d, 80 * i); return d; });
    st.opts = q.opts.slice();
    this.place(st); K.pop(st, row);
    st.taskEl = K.task(st, [['eye', 'q']]);
    st.prompt = '读一读！'; if (!st.G.rdSaid && st.G.game.kind0 !== 'reads') { st.G.rdSaid = true; Voice.say('读一读！', { tag: 'prompt' }); }
  },
  onGesture(st, name, p) {
    if (name !== 'tap') return false;
    if (/^ch\d+$/.test(p.id || '')) { const cell = st.map[p.id]; if (cell) { st.peeked = true; st.noStar = true; Voice.sayNow(ITEM[cell.dataset.ch] ? ITEM[cell.dataset.ch].line : cell.dataset.ch, { tag: 'peek' }); K.hop(st, cell, 10); } return 'ok'; }
    return ZBase.onGesture.call(this, st, name, p);
  },
  place(st) {
    const L = K.L(), size = L ? 230 : 210, n = st.cards ? st.cards.length : 3;
    if (st.row) { const r = st.row.firstChild.getBoundingClientRect(), s = Stage.scale || 1, w = r.width / s; place(st.row, Math.round((L ? 560 : 352) - w / 2), L ? 120 : 250); st.row.style.width = 'auto'; st.row.style.height = 'auto'; }
    /* landscape: one row of three; portrait: two, and one centred below */
    (st.cards || []).forEach((c, i) => {
      if (L) place(c, 560 - (n * size + (n - 1) * 30) / 2 + i * (size + 30), 330, size, size);
      else place(c, i === 2 ? 352 - size / 2 : (i === 0 ? 352 - size - 14 : 352 + 14), i === 2 ? 410 + size + 26 : 410, size, size);
    });
  },
  relayoutQ(st) { this.place(st); },
  async reveal(st) { const e = st.cards[st.q.answer]; K.hop(st, e, 30); Sfx.reveal(); Voice.say(st.q.text, { tag: 'summary' }); this.cheerAll(st); await st.scope.guard(Voice.afterSay(200)); },
  async feedback(st) { const e = st.cards[st.tapped]; if (e) K.wiggle(st, e); await st.scope.wait(700); },
  gestureHint(st) {
    if (st.hintDone || !st.row) return; st.hintDone = true;
    $$('[data-ch]', st.row).forEach(cell => K.hop(st, cell, 10));
    Voice.say('可以点字听听！', { tag: 'prompt' });
  },
};
function knownZh(G) { return poolOf(G, 'zh', true).concat(ITEMS.filter(x => x.kind === 'zh' && (Mem.get(x.k) || learned(x.k))).map(x => x.k)); }

/* "字从句里来": a function word met for the first time - its sentence and picture, then the word lights up and is said */
ZX.meetFw = async function (st, k) {
  if (Store.s.met[k] || !FW_SENTS[k]) return;
  Store.s.met[k] = true; Store.save();
  const L = K.L(), sc = st.scope, s = FW_SENTS[k][0], x = Stage.W / 2, y = L ? Stage.H * 0.42 : Stage.H * 0.4;
  const veil = this.thing(st, Stage.W, Stage.H, 34, ''); Object.assign(veil.style, { background: 'rgba(255,248,236,.9)' }); place(veil, 0, 0, Stage.W, Stage.H);
  const pic = this.thing(st, 320, 320, 35, 'objpop'); pic.appendChild(Scene.node(s[1], 320)); place(pic, x - 160, y - 300, 320, 320);
  const row = this.thing(st, 10, 10, 36, ''); row.style.width = row.style.height = 'auto'; row.appendChild(Sent.node(s[0], 96, -1)); place(row, 0, y + 40);
  const w = row.firstChild.getBoundingClientRect().width / (Stage.scale || 1); place(row, x - w / 2, y + 40); row.style.width = row.style.height = 'auto';
  sc.anim(veil, [{ opacity: 0 }, { opacity: 1 }], { duration: 300 });
  await sc.anim(pic, [{ transform: 'scale(.2)', opacity: 0 }, { transform: 'scale(1)', opacity: 1 }], { duration: 420, easing: EASE.pop });
  Voice.say(s[0], { tag: 'meet' });
  await sc.guard(Voice.afterSay(300));
  if (sc.dead) return;
  const cells = Array.from(row.firstChild.children).filter(c => c.firstChild && c.firstChild.tagName);
  const i = Array.from(s[0]).filter(c => !/[。！？，]/.test(c)).indexOf(k), cell = cells[i];
  if (cell) { cell.style.background = '#FFE08A'; cell.style.borderRadius = '14px'; cell.style.boxShadow = '0 0 0 5px #FF9F43'; sc.anim(cell, [{ transform: 'scale(1)' }, { transform: 'scale(1.35)' }, { transform: 'scale(1)' }], { duration: 700, easing: EASE.pop }); }
  Sfx.sparkle(); sayItem(k, { tag: 'meet' });
  await sc.guard(Voice.afterSay(400)); await sc.wait(300);
  sc.anim(veil, [{ opacity: 1 }, { opacity: 0 }], { duration: 300, fill: 'forwards' });
  await sc.anim(row, [{ opacity: 1 }, { opacity: 0 }], { duration: 300, fill: 'forwards' });
  veil.remove(); pic.remove(); row.remove();
  return true;
};

/* ---------------------------------------------------------------- the sentence islands' four games */
const CASTS2 = { s1: ['ironman', 'spiderman'], s2: ['captain', 'miles'] };
['s1', 's2'].forEach(id => {
  const W = ISL[id], cast = CASTS2[id], host = cast[0], first = W.chars[0].c;
  zGame(QFill, { id: id + ':find', world: id, bg: id + '_find', chars: cast, host, title: '补句子', iconNode: () => Glyph.zh(first, 60) });
  writeGame({ id: id + ':write', world: id, lang: 'zh', bg: id + '_write', chars: cast.slice(0, 1), host, title: '写字', intro: '写一写！', iconNode: () => Glyph.zh(first, 60, '#E8414B'), decor: writeDecor });
  /* no new letters here: the capitals of world 1 come back as old friends, the most due first */
  writeGame({ id: id + ':abc', world: id, lang: 'up', bg: id + '_abc', chars: cast.slice(0, 1), host, title: '写字母', verb: 'ABC', intro: '写字母啦！', iconNode: () => Glyph.en('A', 60, '#2E6FD8'), decor: writeDecor,
    gen(G) { const ups = ITEMS.filter(x => x.kind === 'up' && x.isl).map(x => x.k), due = Mem.due(it => it.kind === 'up').filter(k => !(G.used || []).includes(k)); const k = due[0] || PICK(G, 'up', ups); (G.used = G.used || []).push(k); return { k: [k], answer: k }; } });
  zGame(QReadS, { id: id + ':quiz', world: id, bg: id + '_quiz', chars: cast, host, title: '读一读', boost: 0, iconNode: () => { const d = el('div'); d.innerHTML = ICONS.eye; const s = d.firstChild; s.setAttribute('width', '80%'); s.setAttribute('height', '80%'); Object.assign(d.style, { display: 'flex', alignItems: 'center', justifyContent: 'center', width: '100%', height: '100%' }); return d; } });
  W.games = [id + ':find', id + ':write', id + ':abc', id + ':quiz'];
});

/* ---------------------------------------------------------------- the review planner: how many review questions a session gets
   and which (A.7-A.9): 1-2 by what is due, 3 while the brake is on; never filler from items not due; the missed queue
   asks a wrong item again 2 questions later in another form */
const Review = {
  plan(G) {
    if (G.practice || G.key || (G.game && G.game.ownReview)) return { pos: [] };      /* world 3's writing plans its own old friend */
    const due = Mem.due().length;
    let n = due === 0 ? 0 : due <= 3 ? 1 : 2;
    if (Mem.brake() && due) n = Math.min(3, due);
    n = Math.min(n, Math.max(0, (G.rounds || 5) - (G.needPass || []).length));
    return { pos: [1, 3, 4].slice(0, n) };
  },
  fits(G, k) {
    const it = ITEM[k], g = G.game;
    if (g.kind0 === 'write') return g.lang === 'zh' ? it.kind === 'zh' && !NOWRITE.includes(k) : it.kind === g.lang;
    return true;
  },
  /* the question for this round, or null (an island question) */
  slot(G) {
    if (G.practice) return null;
    if (G.key) { const k = (G.keyItems || [])[G.round]; return k ? { k, form: 'card' } : null; }
    const g = G.game, used = G.rvUsed || (G.rvUsed = []);
    if (G.wfMode === 2) { const form = G.round % 2 ? 'trace' : 'card', its = G.W.chars.map(c => c.c).filter(c => form === 'card' || !NOWRITE.includes(c)), need = its.filter(k => !used.includes(k)); const k = need[0] || G.rng.pick(its); used.push(k); return { k, form, wf: true }; }
    const miss = (G.miss || []).find(m => m.at <= G.round && !m.done);
    if (miss && g.kind0 !== 'write') { miss.done = true; return { k: miss.k, form: 'card', miss: true }; }
    if (!G.rv || !G.rv.pos.includes(G.round)) return null;
    const cand = Mem.due().filter(k => !used.includes(k) && this.fits(G, k) && !poolOf(G, ITEM[k].kind === 'zh' ? 'zh' : 'en', false).includes(k));
    const k = cand[0]; if (!k) return null;
    used.push(k);
    if (g.kind0 === 'write') return { k, form: 'write' };
    if (g.kind0 === 'find' && ITEM[k].kind === 'zh' && !ITEM[k].fw && g.lang !== 'up') return { k, form: 'find' };
    /* after the sentence islands, a challenge game's first review slot is a sentence to read (A.3) */
    if (!G.rdUsed && /:quiz$/.test(g.id || '') && G.rv.pos.length >= 2 && G.round === G.rv.pos[1] && ALL_ISL().indexOf(G.world) > ALL_ISL().indexOf('s2') && ALL_ISL().indexOf(G.world) % 2 === 0) { G.rdUsed = true; used.pop(); return { k: null, form: 'read' }; }
    return { k, form: 'card' };
  },
  /* the game's own question as a frame for a review question: whatever its draw took from the bags (the island's
     characters still to pass), the session's seen keys and the last key all go back (V2R2-01) */
  frame(G) {
    const bags = {}, B = G.bags || {}; Object.keys(B).forEach(n => { bags[n] = B[n].slice(); });
    const seen = G.seenKeys ? new Set(G.seenKeys) : null, last = G.ws.lastKey, asked = (G.asked || []).slice();
    const st = Session.newQ(G, {});
    G.bags = bags; if (seen) G.seenKeys = seen; else delete G.seenKeys; G.ws.lastKey = last; G.asked = asked;
    return st;
  },
  /* a question state for a review slot (the game's own frame where it fits; otherwise the review card) */
  newQ(G, rv) {
    const S = Session;
    if (rv.k || rv.form === 'read') (G.asked || (G.asked = [])).push(rv.k || null);       /* frame() put back what the frame asked */
    if (rv.form === 'find' || rv.form === 'write' || rv.form === 'trace') {
      const st = this.frame(G);
      if (rv.form === 'find') { const opts = optsFor(G, 'zh', G.level, st.q.opts.length, rv.k); st.q = { k: [rv.k, opts.join('')], answer: rv.k, opts }; }
      else st.q = { k: [rv.k], answer: rv.k };
      st.review = true;
      if (rv.form === 'trace') { st.level = 1; st.noStar = true; st.wf = true; st.tracing = true; }          /* tracing practice: no star, no pass, no box (A.4) */
      return st;
    }
    /* built like every game (GameBase + ZBase): evaluate, cleanup, the card taps */
    const game = Object.assign(Object.create(GameBase), ZBase, rv.form === 'read' ? QReadS : ReviewQ, { chars: G.game.chars, host: G.game.host, id: rv.form === 'read' ? 'read' : 'review' });
    const st = this.frame(G);
    st.game = game; st.kind = game.kind0; st.review = true; st.wf = !!rv.wf; st.missQ = !!rv.miss;
    st.q = game.gen(G, { level: G.level, rng: G.rng, item: rv.k });
    return st;
  },
};

/* ---------------------------------------------------------------- the writing fallback (A.4): three characters in a row
   without their star on this island -> the tracing level (full demo, start dot, arrows: built-in guides, not help);
   three more there -> this game's remaining stars come from reading tasks about the same characters. This island only. */
const WriteFallback = {
  start(G) {
    if (G.practice || G.game.kind0 !== 'write' || G.game.lang !== 'zh') return;
    const wf = G.ws.wf || (G.ws.wf = { s: 0, m: 0 });
    if (Store.s.settings.wgate) { G.wfMode = 2; return; }
    G.wfMode = wf.m;
    if (wf.m >= 1) G.level = 1;
  },
  after(G, st, res) {
    if (G.practice || G.game.kind0 !== 'write' || G.game.lang !== 'zh' || st.review && !st.wf) return;
    const wf = G.ws.wf || (G.ws.wf = { s: 0, m: 0 });
    if (st.wf) return;
    if (res === 'ok' && !helped(st)) { wf.s = 0; Store.s.stat.clean++; }
    else if (res === 'ok') { wf.s++; }
    else if (res === 'wrong') { wf.s++; if (wf.s >= 3 && wf.m < 2) { wf.m++; wf.s = 0; Store.s.stat.wfDown++; if (wf.m === 1) G.level = 1; else G.wfMode = 2; } }
    Store.save();
  },
};

const CARDS = ['ultraman', 'optimus', 'ironman', 'spiderman', 'captain', 'bumblebee', 'zero', 'hulk', 'thor', 'wukong', 'panther', 'miles',
  'gourd1', 'gourd2', 'gourd3', 'gourd4', 'gourd5', 'gourd6', 'gourd7', 'catboy', 'owlette', 'gekko', 'widow', 'hawkeye',
  'chase', 'marshall', 'rubble', 'ryder', 'bajie', 'shaseng', 'dragon_horse', 'peppa', 'george', 'bluey', 'bingo', 'kaiju1'];
const Keys = {
  avail() { const k = Store.s.key; return k.day !== DAY(); },
  /* the key round: the most overdue items first (A.13); a long break -> the first day back is free */
  start() {
    { const S = Store.s, d = DAY(), quits = [d, d - 1, d - 2].map(x => S.days[x]).filter(Boolean).reduce((a, x) => a + Math.max(0, x.keyGo - x.keyEnd), 0); if (quits >= 2 && !S.key.short) { S.key.short = true; Store.save(); } }     /* V2R3-03 */
    /* the characters first, letters after (the key is for 认字 first, V2R3-06) - each group most overdue first */
    const all = Mem.due(), due = all.filter(k => ITEM[k] && ITEM[k].kind === 'zh').concat(all.filter(k => !ITEM[k] || ITEM[k].kind !== 'zh'));
    const k = Store.s.key, n = Math.min(Store.s.key.short ? 3 : 5, due.length), gap = Store.s.lastDay ? DAY() - Store.s.lastDay : 0;

    a.n++; a.src.push(src); Store.save();

/* the parent's red dot: the child has reached the last installed world, or less than 14 days of new islands left at the
   pace of the last week (A.22) */
const Supply = {
  low() {
    const last = Object.keys(ORDER).slice(-1)[0];

    const d = DAY(), recent = (Store.s.flagDays || []).filter(x => x > d - 7).length, left = ALL_ISL().filter(id => !flagged(id)).length;
    return recent > 0 && left / (recent / 7) < 14;
  },
};

    st.scope.anim(e, [{ transform: 'scale(1) rotate(0)', opacity: 1 }, { transform: 'scale(1.15) rotate(-6deg)', opacity: 1, offset: 0.3 }, { transform: 'scale(.3) rotate(20deg)', opacity: 0 }], { duration: 380, fill: 'forwards' }).then(() => { if (!st.scope.dead) e.style.visibility = 'hidden'; });
    st.lastAt = { x: b.x + b.w / 2, y: b.y + b.h / 2 };
    if (st.got >= st.need) Session.submit(st, st.q.answer);
    return 'ok';
  },
  async reveal(st) {
    const at = st.lastAt || { x: Stage.W / 2, y: Stage.H / 2 };
    if (st.tally) K.hop(st, st.tally, 20);
    await ZX.alive(st, st.q.answer, at.x, at.y, 170);
    sayItem(st.q.answer); this.cheerAll(st);
    await st.scope.guard(Voice.afterSay(200));
  },
  nope(st, i) { const e = st.cards[i]; if (e) st.scope.anim(e, [{ transform: 'translateX(0)' }, { transform: 'translateX(-8px)' }, { transform: 'translateX(8px)' }, { transform: 'translateX(0)' }], { duration: 300 }); },
  next(st, strat) {
    if (!st.vals) return null;
    const i = strat === 'wrong' ? st.vals.findIndex(v => v !== st.q.answer) : st.vals.findIndex((v, j) => v === st.q.answer && !st.smashed.includes(j));
    return i < 0 ? null : { g: 'tap', p: { id: 'card' + i } };
  },
  workEls(st) { return (st.cards || []).filter((c, i) => !(st.smashed || []).includes(i)); },
  snap(st) { return { opts: st.vals || null, got: st.got || 0, need: st.need || 0 }; },
};

/* 雷神 · 甩锤子 - "throw it": the storm clouds stand round Thor in a fan; flick the hammer TOWARDS the right cloud (the
   direction chooses, nothing is tapped) - its lightning breaks the cloud open. A tap on a cloud or the hammer only says how. */
const PlayHammer = {
  rule: 'flick-towards', intro: '甩锤子劈乌云！', props: ['stormcloud'], maxN: 4,
  gen(G, o) { const q = FindBase.gen.call(this, G, o); q.moving = o.level >= 5 ? 1 : 0; return q; },     /* level 5: the clouds drift */
  targets(st) {
    st.cards = st.opts.map((k, i) => {
      const d = ZX.thing(st, 180, 130, 6, 'item'); ZX.pic('assets/props/stormcloud.png', d);
      const s = ZX.sign(k, 70); Object.assign(s.style, { left: 'calc(50% - 35px)', top: '26%', background: '#F2F6FF' }); d.appendChild(s);
      K.reg(st, 'card' + i, d, {}); K.pop(st, d, 70 * i);
      if (st.level >= 5) Loops.run(d, [{ transform: 'translateX(0)' }, { transform: 'translateX(' + (i % 2 ? -30 : 30) + 'px)' }, { transform: 'translateX(0)' }], { duration: 2600 + 300 * i, easing: 'ease-in-out' });
      else Loops.run(d, [{ transform: 'translateY(0)' }, { transform: 'translateY(-6px)' }, { transform: 'translateY(0)' }], { duration: 1800 + 230 * i });
      return d;
    });
    const h = st.hammer = ZX.thing(st, 124, 124, 9, 'item'); h.innerHTML = W3X.hammer;
    Object.assign(h.style, { display: 'flex', alignItems: 'center', justifyContent: 'center', borderRadius: '50%', background: 'rgba(255,255,255,.92)', boxShadow: '0 0 0 4px #2B2118, 0 0 0 10px rgba(127,228,255,.8)' });
    K.reg(st, 'hammer', h, { flick: (p, c) => this.aim(st, c), follow: true });        /* it moves with the finger, flies on letting go */
    Loops.run(h, [{ transform: 'rotate(-6deg)' }, { transform: 'rotate(6deg)' }, { transform: 'rotate(-6deg)' }], { duration: 1600 });
  },
  /* the clouds nearest the flick's direction first (Input takes the first within 35 degrees) */
  aim(st, c) {
    const out = st.cards.map((e, i) => ({ id: 'card' + i, center: () => center(e) }));
    if (!c || !c.path || c.path.length < 2) return out;
    const a = c.path[c.path.length - 1], ang = Math.atan2(a.y - c.y0, a.x - c.x0);
    const d = e => { const cc = e.center(); let x = Math.atan2(cc.y - c.y0, cc.x - c.x0) - ang; while (x > Math.PI) x -= 2 * Math.PI; while (x < -Math.PI) x += 2 * Math.PI; return Math.abs(x); };
    const near = out.sort((p, q) => d(p) - d(q));
    /* between two clouds (W3R2-08): not a throw at either - the hammer comes back, "throw it" (a miss of the hand, not a wrong answer) */
    if (!near.length || d(near[0]) > 20 * Math.PI / 180) { if (Session.alive(st) && (!st.toldHow || Clock.t() - st.toldHow > 4000)) { st.toldHow = Clock.t(); Voice.sayNow('把锤子甩出去！', { tag: 'how' }); } return []; }
    return near;
  },
  geo() { return K.L() ? { cx: 512, cy: 590, R: 330, a0: -165, a1: -15, w: 190, h: 140 } : { cx: 352, cy: 900, R: 330, a0: -145, a1: -35, w: 150, h: 112 }; },
  place(st) {
    if (!st.cards) return;
    const g = this.geo(), n = st.cards.length;
    st.cards.forEach((d, i) => { const a = (g.a0 + (g.a1 - g.a0) * (n === 1 ? 0.5 : i / (n - 1))) * Math.PI / 180; place(d, g.cx + g.R * Math.cos(a) - g.w / 2, g.cy + g.R * Math.sin(a) - g.h / 2, g.w, g.h); });
    if (st.hammer) { st.hammer.style.transform = ''; place(st.hammer, g.cx - 62, g.cy - 62, 124, 124); }
  },
  decor(G) { const L = K.L(), a = G.actors.thor; this.chars.forEach(id => hideActor(G.actors[id])); if (a) showActor(a, L ? 360 : 190, L ? 704 : 1020, L ? 210 : 170); },
  onGesture(st, name, p) {
    if (st.submitted) return false;
    if (name === 'drop' && p.id === 'hammer') { const i = K.cardIndex(p.to); if (i < 0) return false; st.hammer.getAnimations().forEach(a => a.cancel()); st.hammer.style.transform = ''; st.tapped = i; Session.submit(st, st.opts[i]); return 'ok'; }
    if (name === 'tap' && (p.id === 'hammer' || K.cardIndex(p.id) >= 0)) {          /* how to play, never which one */
      if (st.hammer) K.wiggle(st, st.hammer);
      if (!st.toldHow || Clock.t() - st.toldHow > 4000) { st.toldHow = Clock.t(); Voice.sayNow('把锤子甩出去！', { tag: 'how' }); }
      return 'free';
    }
    return false;
  },
  async fly(st, i, back) {
    const h = st.hammer, b = box(st.cards[i]), hb = box(h);
    h.getAnimations().forEach(a => a.cancel());
    Sfx.whoosh(0.4);
    const dx = b.x + b.w / 2 - (hb.x + hb.w / 2), dy = b.y + b.h / 2 - (hb.y + hb.h / 2);
    await st.scope.anim(h, [{ transform: 'translate(0,0) rotate(0)' }, { transform: 'translate(' + dx + 'px,' + dy + 'px) rotate(540deg)' }], { duration: 420, easing: EASE.glide, fill: 'forwards' });
    if (back) await st.scope.anim(h, [{ transform: 'translate(' + dx + 'px,' + dy + 'px) rotate(540deg)' }, { transform: 'translate(0,0) rotate(0)' }], { duration: 420, easing: EASE.glide, fill: 'forwards' });
  },
  async win(st, i) {
    const e = st.cards[i], b = box(e);
    await this.fly(st, i, false);
    const a = st.G.actors.thor; if (a) a.react('zap');
    Sfx.zap(); Fx.bolt(b.x + b.w / 2, b.y + b.h); Fx.burst(b.x + b.w / 2, b.y + b.h / 2, { n: 24, colors: ['#FFE14A', '#FFFFFF', '#7FE4FF'], dist: 140 });
    await st.scope.anim(e, [{ transform: 'scale(1)', opacity: 1 }, { transform: 'scale(1.4)', opacity: 0 }], { duration: 380, fill: 'forwards' });
    await ZX.alive(st, st.q.answer, b.x + b.w / 2, b.y + b.h / 2, 160);
  },
  nope(st, i) { this.fly(st, i, true); },
  next(st, strat) { if (!st.cards) return null; const i = strat === 'wrong' ? st.opts.findIndex(v => v !== st.q.answer) : st.opts.indexOf(st.q.answer); return { g: 'drop', p: { id: 'hammer', to: 'card' + i }, to: center(st.cards[i]) }; },
  workEls(st) { return st.hammer ? [st.hammer] : []; },
  gestureHint(st, reteach) {
    if (!reteach) FindBase.gestureHint.call(this, st);           /* a re-teach shows the throw only, never the picture (W3R2-01) */
    if (st.hammer) st.scope.anim(st.hammer, [{ transform: 'translateY(0)' }, { transform: 'translateY(-60px) rotate(30deg)' }, { transform: 'translateY(0)' }], { duration: 700, easing: EASE.glide });
  },
};

/* 黑豹 · 跳石头 - "the colours lie": Panther leaps onto the stone with the right character. Levels 1-2 plain signs (the first
   sessions: colours are being learned); 3 the signs are painted, never in their own colour; 4 the characters themselves are
   inked in a colour that is never their own (红 written in blue ...); 5 both - read the character, not the colour (W3R1-07).
   Drag Panther along the stones and let go, or tap a stone. */
const PlayLeap = {
  rule: 'misleading-ink', intro: '黑豹跳石头！', props: ['platform'],
  gen(G, o) { const q = FindBase.gen.call(this, G, o); q.stroop = [0, 0, 0, 1, 2, 3][o.level]; return q; },
  targets(st) {
    const G = st.G, lv = st.level, n = st.opts.length, pal = Object.keys(INKS);
    /* a colour for every option that is never its own (a derangement over the colour characters) */
    let ink = null;
    for (let t = 0; t < 40 && !ink; t++) { const c = st.opts.map(() => G.rng.pick(pal)); if (st.opts.every((k, i) => c[i] !== k) && new Set(c).size >= Math.min(n, 4)) ink = c; }
    ink = ink || st.opts.map((k, i) => pal[(pal.indexOf(k) + 1 + i) % 5]);
    st.ink = ink;
    st.cards = st.opts.map((k, i) => {
      const d = ZX.thing(st, 140, 170, 6, 'item'); ZX.pic('assets/props/platform.png', d).style.top = '22%';
      const c = ink[i], c2 = pal.find(x => x !== k && x !== c && x !== '白') || c, s = el('div', 'sign');
      const paint = lv === 3 ? c : lv >= 5 ? c2 : null, inkC = lv >= 4 ? c : null;      /* never the character's own colour */
      Object.assign(s.style, { position: 'absolute', width: '96px', height: '96px', left: 'calc(50% - 48px)', top: '-2%', background: inkC === '白' ? '#3B3B4A' : paint ? this.tint(paint) : '#FFF8EC' });
      s.appendChild(Glyph.zh(k, 78, inkC ? INKS[inkC] : INK));
      d.appendChild(s);
      K.reg(st, 'card' + i, d, {}); K.pop(st, d, 70 * i);
      return d;
    });
  },
  tint(c) { return { 红: '#FFC9C4', 黄: '#FFF0A8', 蓝: '#C4DAFF', 绿: '#C8F0C8', 白: '#FFFFFF' }[c] || '#FFF8EC'; },
  place(st) {
    if (!st.cards) return;
    const L = K.L(), n = st.cards.length, r = L ? { x: 250, y: 400, w: 700, h: 0 } : { x: 40, y: 730, w: 624, h: 0 }, w = L ? 140 : Math.min(140, Math.floor(r.w / n) - 16), h = Math.round(w * 170 / 140);
    st.cards.forEach((d, i) => { const x = r.x + r.w * (i + 0.5) / n; place(d, x - w / 2, r.y - h / 2 + (i % 2 ? 26 : -10), w, h); });
    this.home(st);
  },
  home(st) { const a = st.G.actors.panther; if (a && !st.leapt) { const L = K.L(); a.at(L ? 140 : 110, L ? 520 : 560); } },
  decor(G) { const L = K.L(), a = G.actors.panther; this.chars.forEach(id => hideActor(G.actors[id])); if (a) { showActor(a, L ? 140 : 110, L ? 520 : 560, L ? 200 : 170); } },
  bindRunner(st) {
    const a = st.G.actors.panther; if (!a) return;
    K.reg(st, 'runner', a.root, { slide: st.cards.map((c, i) => ({ id: 'card' + i, rect: () => box(c) })) });
  },
  async present(st) { await FindBase.present.call(this, st); if (Session.alive(st)) this.bindRunner(st); },
  onGesture(st, name, p) {
    if (st.submitted) return false;
    const a = st.G.actors.panther;
    if (name === 'pass' && p.id === 'runner') { const i = K.cardIndex(p.at); if (i >= 0 && a) { const b = box(st.cards[i]); a.at(b.x + b.w / 2, b.y + b.h * 0.25); Sfx.hop(); } return 'free'; }
    if (name === 'pick' && p.id === 'runner') { const i = K.cardIndex(p.at); if (i < 0) return false; st.tapped = i; Session.submit(st, st.opts[i]); return 'ok'; }
    if (name === 'tap' && p.id === 'runner') { if (a) a.react('pounce'); return 'free'; }
    return ZBase.onGesture.call(this, st, name, p);
  },
  async win(st, i) {
    const e = st.cards[i], b = box(e), a = st.G.actors.panther;
    st.leapt = true;
    if (a) { await a.moveTo(b.x + b.w / 2, b.y + b.h * 0.25, 480, 140); a.react('pounce'); }
    Sfx.splash(); Fx.burst(b.x + b.w / 2, b.y + b.h, { n: 16, colors: ['#7FD3FF', '#4FB3FF', '#FFFFFF'], dist: 90, fall: true });
    await ZX.alive(st, st.q.answer, b.x + b.w / 2 + (b.x > Stage.W / 2 ? -150 : 150), b.y - 40, 150);
  },
  nope(st, i) {
    const e = st.cards[i]; if (e) st.scope.anim(e, [{ transform: 'translateY(0)' }, { transform: 'translateY(14px)' }, { transform: 'translateY(0)' }], { duration: 420 });
    Sfx.splash(); this.home(st);
  },
  cleanup(st) { st.leapt = false; },
};

/* 黑寡妇 · 手电筒 - "find it in the dark": the room is dark, the characters hang on the walls; only what the torch lights can
   be seen (level 1 dim, level 5 black). Drag the torch onto the right one and let go - or tap a card: the torch goes there,
   a tap on a lit card chooses it. */
const PlayTorch = {
  rule: 'search-in-the-dark', intro: '打开手电筒找！', props: ['torch'],
  gen(G, o) { const q = FindBase.gen.call(this, G, o); q.dark = this.dark(o.level); return q; },
  dark(lv) { return [0, 0.55, 0.74, 0.88, 0.92, 0.95][lv] || 0.9; },
  rad(lv) { return [0, 150, 140, 130, 125, 115][lv] || 125; },
  targets(st) {
    st.cards = st.opts.map((k, i) => { const d = ZX.thing(st, 140, 140, 6, 'item'); const s = ZX.sign(k, 120); Object.assign(s.style, { left: '7%', top: '7%' }); d.appendChild(s); K.reg(st, 'card' + i, d, {}); return d; });
    st.cellsL = K.cells(st.G.rng, st.opts.length, 3, 2, 0.4); st.cellsP = K.cells(st.G.rng, st.opts.length, 2, 3, 0.4);
    const v = st.veil = ZX.thing(st, Stage.W, Stage.H, 25, 'item'); v.style.pointerEvents = 'none';
    const t = st.torch = ZX.thing(st, 120, 120, 28, 'item'); ZX.pic('assets/props/torch.png', t);
    Object.assign(t.style, { borderRadius: '50%', background: 'rgba(255,248,214,.9)', boxShadow: '0 0 0 4px #2B2118' });
    K.reg(st, 'torch', t, { drag: true, drops: () => st.cards.map((c, i) => ({ id: 'card' + i, rect: () => box(c) })), onDragMove: p => this.light(st, p.x, p.y) });
  },
  light(st, x, y) {
    st.lx = x; st.ly = y;
    const R = this.rad(st.level), A = this.dark(st.level);
    if (st.veil) st.veil.style.background = 'radial-gradient(circle at ' + Math.round(x) + 'px ' + Math.round(y) + 'px, rgba(10,12,34,0) 0, rgba(10,12,34,0) ' + R + 'px, rgba(10,12,34,' + A + ') ' + (R + 46) + 'px)';
  },
  lit(st, i) { const c = center(st.cards[i]); return st.lx != null && Math.hypot(c.x - st.lx, c.y - st.ly) < this.rad(st.level) * 0.75; },
  home(st) { const L = K.L(), x = L ? 512 : 352, y = L ? 616 : 920; if (st.torch) { st.torch.style.transform = ''; place(st.torch, x - 60, y - 60, 120, 120); } return { x, y: y - 40 }; },
  place(st) {
    if (!st.cards) return;
    const L = K.L(), r = L ? { x: 170, y: 120, w: 690, h: 390 } : { x: 60, y: 240, w: 584, h: 560 }, cells = L ? st.cellsL : st.cellsP;
    st.cards.forEach((d, i) => { const [u, v] = cells[i]; place(d, r.x + u * r.w - 70, r.y + v * r.h - 70, 140, 140); });
    place(st.veil, 0, 0, Stage.W, Stage.H);
    const h = this.home(st); this.light(st, h.x, h.y);
  },
  onGesture(st, name, p) {
    if (st.submitted) return false;
    if (name === 'drop' && p.id === 'torch') { const i = K.cardIndex(p.to); if (i < 0) return false; st.tapped = i; Session.submit(st, st.opts[i]); return 'ok'; }
    if (name === 'tap' && p.id === 'torch') return 'free';
    const i = name === 'tap' ? K.cardIndex(p.id) : -1; if (i < 0) return false;
    if (!this.lit(st, i)) { const c = center(st.cards[i]); this.light(st, c.x, c.y); Sfx.sparkle(); return 'free'; }       /* the torch goes there first */
    st.tapped = i; Sfx.tap(); Session.submit(st, st.opts[i]);
    return 'ok';
  },
  async win(st, i) {
    const e = st.cards[i], b = box(e);
    if (st.veil) st.scope.anim(st.veil, [{ opacity: 1 }, { opacity: 0 }], { duration: 500, fill: 'forwards' });
    K.hop(st, e, 30); Sfx.reveal();
    const a = st.G.actors.widow; if (a) a.react('flip');
    await ZX.alive(st, st.q.answer, b.x + b.w / 2 + (b.x > Stage.W / 2 ? -150 : 150), b.y + b.h / 2, 150);
  },
  nope(st) { const h = this.home(st); this.light(st, h.x, h.y); },
  next(st, strat) {
    if (!st.cards) return null;
    const i = strat === 'wrong' ? st.opts.findIndex(v => v !== st.q.answer) : st.opts.indexOf(st.q.answer);
    return this.lit(st, i) ? { g: 'tap', p: { id: 'card' + i } } : { g: 'drop', p: { id: 'torch', to: 'card' + i }, to: center(st.cards[i]) };
  },
  workEls(st) { return st.torch ? [st.torch] : []; },
  /* the 2nd hint: the light sweeps the whole room once (every card, the same) */
  gestureHint(st, reteach) {
    if (!reteach) FindBase.gestureHint.call(this, st);           /* a re-teach: the light sweeps the room only (W3R2-01) */
    if (!st.cards || st.sweeping) return; st.sweeping = true;
    const L = K.L(), y = L ? 300 : 520, x0 = 80, x1 = Stage.W - 80, t0 = now(), dur = T(1600) || 1;
    const step = () => { if (st.scope.dead) return; const k = Math.min(1, (now() - t0) / dur); this.light(st, x0 + (x1 - x0) * k, y); if (k < 1) requestAnimationFrame(step); else { st.sweeping = false; const h = this.home(st); this.light(st, h.x, h.y); } };
    step();
  },
};

/* 鹰眼 · 射箭 - "aim, then shoot": tap a target to aim at it (the line shows where the arrow will go; aim again as often as
   you like), then press the bow to shoot. Only the shot counts. */
const PlayAim = {
  rule: 'aim-then-shoot', intro: '瞄准，射箭！', props: ['target'],
  targets(st) {
    st.aim = null;
    st.cards = st.opts.map((k, i) => {
      const d = ZX.thing(st, 150, 180, 6, 'item'); ZX.pic('assets/props/target.png', d);
      const s = ZX.sign(k, 74); Object.assign(s.style, { left: 'calc(50% - 37px)', top: '16%', borderRadius: '50%' }); d.appendChild(s);
      K.reg(st, 'card' + i, d, {}); K.pop(st, d, 70 * i);
      return d;
    });
    const f = st.fire = ZX.thing(st, 130, 130, 30, 'item'); f.innerHTML = W3X.bow;
    Object.assign(f.style, { display: 'flex', alignItems: 'center', justifyContent: 'center', borderRadius: '50%', background: '#fff', boxShadow: '0 0 0 4px #2B2118, 0 0 0 10px rgba(142,108,255,.6)' });
    K.reg(st, 'fire', f, {});
    st.aimSvg = K.lines(st);
  },
  place(st) {
    if (!st.cards) return;
    const L = K.L(), n = st.cards.length, r = L ? { x: 270, y: 250, w: 700 } : { x: 30, y: 430, w: 644 }, w = L ? 150 : Math.min(150, Math.floor(r.w / n) - 14), h = Math.round(w * 1.2);
    st.cards.forEach((d, i) => place(d, r.x + r.w * (i + 0.5) / n - w / 2, r.y - h / 2 + (i % 2 ? 40 : 0), w, h));
    place(st.fire, L ? 250 : 287, L ? 500 : 730, 130, 130);
    this.drawAim(st);
  },
  decor(G) { const L = K.L(), a = G.actors.hawkeye; this.chars.forEach(id => hideActor(G.actors[id])); if (a) showActor(a, L ? 110 : 120, L ? 700 : 1016, L ? 230 : 180); },
  drawAim(st) {
    const s = st.aimSvg; if (!s) return; s.innerHTML = '';
    st.cards.forEach((c, i) => c.classList.toggle('hi', i === st.aim));
    if (st.aim == null) return;
    const a = center(st.fire), b = center(st.cards[st.aim]);
    svg('line', { x1: a.x, y1: a.y, x2: b.x, y2: b.y, stroke: '#8E6CFF', 'stroke-width': 7, 'stroke-dasharray': '4 16', 'stroke-linecap': 'round' }, s);
  },
  onGesture(st, name, p) {
    if (name !== 'tap' || st.submitted) return false;
    if (p.id === 'fire') {
      if (st.aim == null) { K.wiggle(st, st.fire); Voice.sayNow('先瞄准一个靶子！', { tag: 'how' }); return 'free'; }
      st.tapped = st.aim; Session.submit(st, st.opts[st.aim]); return 'ok';
    }
    const i = K.cardIndex(p.id); if (i < 0) return false;
    st.aim = i; Sfx.tap(); this.drawAim(st);
    const a = st.G.actors.hawkeye; if (a) a.lookAt(center(st.cards[i]).x, center(st.cards[i]).y);
    return 'ok';
  },
  async shoot(st, i) {
    const a = center(st.fire), b = center(st.cards[i]);
    const s = K.lines(st), g = svg('g', {}, s);
    svg('path', { d: 'M-40 0H30', stroke: '#2B2118', 'stroke-width': 6, 'stroke-linecap': 'round' }, g);
    svg('path', { d: 'M26 -10L46 0L26 10Z', fill: '#E8413A', stroke: '#2B2118', 'stroke-width': 3 }, g);
    const ang = Math.atan2(b.y - a.y, b.x - a.x) * 180 / Math.PI;
    Sfx.whoosh(0.3); const h = st.G.actors.hawkeye; if (h) h.react('aim');
    await st.scope.anim(g, [{ transform: 'translate(' + a.x + 'px,' + a.y + 'px) rotate(' + ang + 'deg)' }, { transform: 'translate(' + b.x + 'px,' + b.y + 'px) rotate(' + ang + 'deg)' }], { duration: 360, easing: EASE.glide, fill: 'forwards' });
    return g;
  },
  async win(st, i) { const e = st.cards[i], b = box(e); await this.shoot(st, i); Sfx.thud(); K.hop(st, e, 24); Fx.burst(b.x + b.w / 2, b.y + b.h * 0.4, { n: 18, dist: 110 }); await ZX.alive(st, st.q.answer, b.x + b.w / 2, b.y - 50, 140); },
  nope(st, i) { this.shoot(st, i).then(g => { if (g && !st.scope.dead) st.scope.anim(g, [{ opacity: 1 }, { opacity: 0, transform: 'translateY(60px)' }], { duration: 400, fill: 'forwards' }); }); st.aim = null; this.drawAim(st); },
  next(st, strat) {

  cleanup(st) { st.aim = null; },

/* ================================================================ 英文: words now (CVC words with a picture and a recording,
   docs/PLAN-v2.md A.5). The base: picture cards / letter cards, the word said by the American voice. */
const EnBase = {
  kind0: 'en', verb: 'ABC', boost: 0,
  itemOf() { return null; },
  picCards(st, words, opt) { return K.cards(st, words.map(w => W3X.pic(w, (opt.size || 160) * 0.84)), words, Object.assign({ cls: 'pic' }, opt)); },
  letterCards(st, letters, opt) { return K.cards(st, letters.map(l => Glyph.en(l, (opt.size || 150) * 0.7)), letters, opt); },

  onGesture(st, name, p) { if (name !== 'tap' || st.picked) return false; const i = K.cardIndex(p.id); if (i < 0) return false; st.picked = true; st.tapped = i; Sfx.tap(); Session.submit(st, st.opts[i]); return 'ok'; },

/* the 2nd hint of the English games (W3R1-03): the question once more, slowly, its pieces lit one by one. That only says the

const EnHint = {

   itself; a reminder costs no star (W3R1-03, V2R2-04) */
const ReadHint = { softHint: true, gestureHint(st) { if (st.hintDone || !st.readEl) return; st.hintDone = true; K.hop(st, st.readEl, 16); Voice.say('可以点字听听！', { tag: 'prompt' }); } };

/* 绿巨人 · 押韵 - "which one rhymes": the word, then each picture is named; tap the one that sounds like it at the end
   (cat - bat). Levels (W3R1-01): 1 three pictures; 2 one of them STARTS like the word (cat - cup: the same start is no rhyme);
   3 four pictures; 4 two more share its vowel (cat - bag: only the whole ending tells); 5 five pictures. */
const ERhyme = {
  rule: 'rhyme', intro: '押韵找朋友！', softHint: true,
  gen(G, o) {
    const lv = o.level, words = W3X.words(), rime = w => w.slice(1), fam = {};
    words.forEach(w => (fam[rime(w)] = fam[rime(w)] || []).push(w));
    const n = [0, 3, 3, 4, 4, 5][lv], allit = lv >= 2, vow = [0, 0, 0, 0, 2, 3][lv];
    const noR = T => words.filter(x => rime(x) !== rime(T));
    const ok = T => fam[rime(T)].length >= 2 && (!allit || noR(T).some(x => x[0] === T[0])) && noR(T).filter(x => x[1] === T[1] && x[0] !== T[0]).length >= vow;
    const last = (G.asked || []).slice(-1)[0], T = bagFrom(G, 'w', words.filter(w => ok(w) && fam[rime(w)].some(x => x !== w && x !== last))), R = G.rng.pick(fam[rime(T)].filter(w => w !== T && w !== last));
    const objs = new Set([W3X.obj(T), W3X.obj(R)]), others = [];
    const add = x => { if (others.length < n - 1 && !others.includes(x) && !objs.has(W3X.obj(x))) { objs.add(W3X.obj(x)); others.push(x); return true; } return false; };
    let a = 0, v = 0;
    if (allit) G.rng.shuffle(noR(T).filter(x => x[0] === T[0])).some(x => add(x) && ++a);
    G.rng.shuffle(noR(T).filter(x => x[1] === T[1] && x[0] !== T[0])).forEach(x => { if (v < vow && add(x)) v++; });
    G.rng.shuffle(noR(T).filter(x => x[1] !== T[1] && x[0] !== T[0])).forEach(add);
    return { k: [T, R, others.join()], target: T, answer: R, item: R, opts: W3X.put(G, others, R), allit: a, vow: v };
  },
  async present(st) {
    const q = st.q;
    st.top = this.bigPic(st, q.target, 160);
    this.picCards(st, q.opts, Object.assign({ size: 150, gap: 26 }, this.cardSpot()));

    await st.scope.guard(Voice.afterSay(150));
    for (let i = 0; i < q.opts.length; i++) {           /* every picture named, one by one (the child need not know the word) */
      if (!Session.alive(st)) return;
